<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQP Studio - GDrive ViewOnly Saver</title>
    <style>
        :root {
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-input: #16213e;
            --accent: #4361ee;
            --accent-hover: #3a56d4;
            --text: #e8e8e8;
            --text-dim: #8892b0;
            --border: #2d2d44;
            --success: #06d6a0;
            --error: #ef476f;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #4361ee, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-dim);
            margin-top: 10px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.4);
        }
        
        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.loading {
            display: block;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .status.success {
            display: block;
            background-color: rgba(6, 214, 160, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status.error {
            display: block;
            background-color: rgba(239, 71, 111, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-dim);
            font-size: 12px;
        }
        
        #downloadLink {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        #downloadLink a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
        #downloadLink a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔓 LQP GDrive Saver</h1>
        <p>Download view-only Google Drive files in high quality</p>
    </div>

    <div class="card">
        <div class="input-group">
            <label for="url">Google Drive URL (File or Folder):</label>
            <input type="text" id="url" placeholder="https://drive.google.com/file/d/FILE_ID/view" autocomplete="off">
        </div>
        
        <button class="btn" id="downloadBtn" onclick="startDownload()">⬇️ Start Download</button>

        <div id="statusBox" class="status"></div>
        
        <div id="downloadLink">
            <a id="fileLink" href="#" download>📥 Click here to download your file</a>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Le Quy Phat</p>
    </div>
</div>

<script>
    async function startDownload() {
        const urlInput = document.getElementById('url').value.trim();
        const btn = document.getElementById('downloadBtn');
        const statusBox = document.getElementById('statusBox');
        const dlLink = document.getElementById('downloadLink');
        
        if (!urlInput) {
            statusBox.className = 'status error';
            statusBox.innerText = '❌ Please enter a Google Drive URL';
            return;
        }

        // Reset UI
        btn.disabled = true;
        btn.innerText = '⏳ Processing... (This takes time)';
        statusBox.className = 'status loading';
        statusBox.innerText = '⚙️ Server is running Chrome headless to capture the file. Please wait, this may take up to 60 seconds...';
        dlLink.style.display = 'none';

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (response.ok) {
                statusBox.className = 'status success';
                statusBox.innerText = '✅ File processed successfully!';
                
                // Set download link
                const link = document.getElementById('fileLink');
                link.href = '/api/file?path=' + encodeURIComponent(data.file_path);
                dlLink.style.display = 'block';
            } else {
                statusBox.className = 'status error';
                statusBox.innerText = '❌ Error: ' + (data.detail || 'Unknown error occurred.');
            }
        } catch (err) {
            statusBox.className = 'status error';
            statusBox.innerText = '❌ Network error or server timeout. Vercel Serverless might have timed out!';
        } finally {
            btn.disabled = false;
            btn.innerText = '⬇️ Start Download';
        }
    }
</script>

</body>
</html>
